[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eigopop"
version = "0.1.0"
description = "Real-time on-screen Japanese OCR and morphological popup dictionary assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "manga-ocr>=0.1.16",
    "sudachipy>=0.6.8",
    "sudachidict_core>=20240409",
    "jamdict>=0.1a11",
    "jamdict-data>=1.5",
    "mss>=9.0.0",
    "PyQt6>=6.6.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
